[project]
name = "pybgpflux"
version = "0.5.1"
description = "Drop-in replacement for PyBGPStream using BGPKIT"
readme = "README.md"
authors = [
    { name = "JustinLoye", email = "jloye@iij.ad.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "pybgpkit>=0.6.2",
    "pydantic>=2.11.9",
    "websocket-client>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "py-radix>=1.1.0",
    "pybgpstream>=2.0.2",
    "pytest>=8.4.2",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.25.0",
    "griffe-pydantic"
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
]

[project.scripts]
pybgpflux = "pybgpflux.cli:main"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "-q -rs"

[project.urls]
Repository = "https://github.com/JustinLoye/pybgpflux"
Documentation = "https://justinloye.github.io/pybgpflux"
